name: JobFlow CI Security Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    ####################################################
    # Checkout
    ####################################################

    - name: Checkout repository
      uses: actions/checkout@v4

    ####################################################
    # JAVA
    ####################################################

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Build Backend
      working-directory: Back
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    ####################################################
    # NODE
    ####################################################

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Front/JOBFLOW/package-lock.json

    - name: Build Frontend
      working-directory: Front/JOBFLOW
      run: |
        npm ci
        npm run build

    ####################################################
    # PYTHON
    ####################################################

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Agent dependencies
      working-directory: Agent/jobflow-ai-agent
      run: |
        pip install -r requirements.txt

    - name: Compile Agent
      working-directory: Agent/jobflow-ai-agent
      run: python -m compileall .

    ####################################################
    # Docker Build
    ####################################################

    - name: Build Docker Images
      run: docker compose build

    ####################################################
    # Trivy Filesystem Scan
    ####################################################

    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: .
        format: table

    ####################################################
    # Build Images for Image Scan
    ####################################################

    - name: Build backend image
      run: docker build -t jobflow-backend ./Back

    - name: Build frontend image
      run: docker build -t jobflow-frontend ./Front/JOBFLOW

    - name: Build agent image
      run: docker build -t jobflow-agent ./Agent/jobflow-ai-agent

    ####################################################
    # Trivy Image Scan
    ####################################################

    - name: Scan backend image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: jobflow-backend
        format: table

    - name: Scan frontend image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: jobflow-frontend
        format: table

    - name: Scan agent image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: jobflow-agent
        format: table

    ####################################################
    # Semgrep
    ####################################################

    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: auto

    ####################################################
    # Bandit
    ####################################################

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit
      run: |
        bandit -r Agent/jobflow-ai-agent

    ####################################################
    # SpotBugs
    ####################################################

    - name: SpotBugs
      working-directory: Back
      run: |
        ./mvnw com.github.spotbugs:spotbugs-maven-plugin:spotbugs

    ####################################################
    # Start Application
    ####################################################

    - name: Start containers
      run: docker compose up -d

    ####################################################
    # Wait Backend
    ####################################################

    - name: Wait backend
      run: |
        timeout 120 bash -c '
        until curl -f http://localhost:8080/api/auth/health
        do
          echo "Waiting..."
          sleep 5
        done
        '

    ####################################################
    # ZAP DAST
    ####################################################

    - name: OWASP ZAP Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost'

    ####################################################
    # Logs
    ####################################################

    - name: Docker Logs
      if: always()
      run: docker compose logs

    ####################################################
    # Stop
    ####################################################

    - name: Shutdown
      if: always()
      run: docker compose down -v