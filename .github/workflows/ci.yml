name: JobFlow CI Security Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read
  security-events: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    ####################################################
    # Checkout
    ####################################################

    - name: Checkout repository
      uses: actions/checkout@v4


    ####################################################
    # JAVA BACKEND
    ####################################################

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven


    - name: Build Backend
      working-directory: Back
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests



    ####################################################
    # FRONTEND
    ####################################################

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Front/JOBFLOW/package-lock.json


    - name: Build Frontend
      working-directory: Front/JOBFLOW
      run: |
        npm ci
        npm run build



    ####################################################
    # AI AGENT
    ####################################################

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install Agent dependencies
      working-directory: Agent/jobflow-ai-agent
      run: |
        pip install -r requirements.txt


    - name: Compile Agent
      working-directory: Agent/jobflow-ai-agent
      run: |
        python -m compileall .



    ####################################################
    # DOCKER BUILD
    ####################################################

    - name: Build Docker Images
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        JOBFLOW_PASSWORD: ${{ secrets.JOBFLOW_PASSWORD }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        docker compose build



    ####################################################
    # TRIVY FILE SYSTEM SCAN
    ####################################################

    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@0.33.1
      continue-on-error: true
      with:
        scan-type: fs
        scan-ref: .
        format: table
        severity: CRITICAL,HIGH



    ####################################################
    # DOCKER IMAGE BUILD
    ####################################################

    - name: Build backend image
      run: docker build -t jobflow-backend ./Back


    - name: Build frontend image
      run: docker build -t jobflow-frontend ./Front/JOBFLOW


    - name: Build agent image
      run: docker build -t jobflow-agent ./Agent/jobflow-ai-agent



    ####################################################
    # TRIVY IMAGE SCAN
    ####################################################

    - name: Scan backend image
      uses: aquasecurity/trivy-action@0.33.1
      continue-on-error: true
      with:
        image-ref: jobflow-backend
        format: table
        severity: CRITICAL,HIGH


    - name: Scan frontend image
      uses: aquasecurity/trivy-action@0.33.1
      continue-on-error: true
      with:
        image-ref: jobflow-frontend
        format: table
        severity: CRITICAL,HIGH


    - name: Scan agent image
      uses: aquasecurity/trivy-action@0.33.1
      continue-on-error: true
      with:
        image-ref: jobflow-agent
        format: table
        severity: CRITICAL,HIGH



    ####################################################
    # SAST - SEMGREP
    ####################################################

    - name: Run Semgrep
      uses: semgrep/semgrep-action@v1
      continue-on-error: true
      with:
        config: auto



    ####################################################
    # SAST - BANDIT PYTHON
    ####################################################

    - name: Install Bandit
      run: pip install bandit


    - name: Run Bandit
      continue-on-error: true
      run: |
        bandit -r Agent/jobflow-ai-agent



    ####################################################
    # SAST - SPOTBUGS JAVA
    ####################################################

    - name: SpotBugs
      continue-on-error: true
      working-directory: Back
      run: |
        ./mvnw com.github.spotbugs:spotbugs-maven-plugin:spotbugs



    ####################################################
    # START APPLICATION
    ####################################################

    - name: Start containers
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        JOBFLOW_PASSWORD: ${{ secrets.JOBFLOW_PASSWORD }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        docker compose up -d



    ####################################################
    # HEALTHCHECK
    ####################################################

    - name: Wait backend
      run: |
        timeout 120 bash -c '
        until curl -f http://localhost:8080/api/auth/health
        do
          echo "Waiting backend..."
          sleep 5
        done
        '



    ####################################################
    # DAST - OWASP ZAP
    ####################################################

    - name: OWASP ZAP Scan
      uses: zaproxy/action-baseline@v0.14.0
      continue-on-error: true
      with:
        target: http://localhost



    ####################################################
    # DEBUG
    ####################################################

    - name: Docker Logs
      if: always()
      run: |
        docker compose logs



    ####################################################
    # CLEANUP
    ####################################################

    - name: Shutdown
      if: always()
      run: |
        docker compose down -v