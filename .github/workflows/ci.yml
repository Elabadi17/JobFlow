name: JobFlow CI Security Pipeline


on:
  push:
    branches:
      - main
      - develop

  pull_request:


permissions:
  contents: read
  security-events: write



#########################################################
# BACKEND
#########################################################

jobs:

  backend-build:

    name: Backend Build & SAST

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven



      - name: Build Spring Boot
        working-directory: Back
        run: |
          chmod +x mvnw
          mvn clean package -DskipTests


      - name: SpotBugs
        continue-on-error: true
        working-directory: Back
        run: |
          mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs






#########################################################
# FRONTEND
#########################################################

  frontend-build:


    name: Frontend Build


    runs-on: ubuntu-latest



    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22




      - name: Install dependencies

        working-directory: Front/JobFlow

        run: |
          npm ci



      - name: Build React

        working-directory: Front/JobFlow

        run: |
          npm run build






#########################################################
# AI AGENT
#########################################################

  agent-build:


    name: AI Agent Build & Security


    runs-on: ubuntu-latest



    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"



      - name: Install dependencies

        working-directory: Agent/jobflow-ai-agent

        run: |
          pip install -r requirements.txt



      - name: Python compile

        working-directory: Agent/jobflow-ai-agent

        run: |
          python -m compileall .



      - name: Install Bandit

        run: |
          pip install bandit



      - name: Bandit SAST

        continue-on-error: true

        run: |
          bandit -r Agent/jobflow-ai-agent






#########################################################
# SECURITY SCAN
#########################################################

  security-scan:

    name: Docker & SAST Security

    needs:
      - backend-build
      - frontend-build
      - agent-build

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Create reports directory
        run: mkdir -p security-reports



    ###################################################
    # Docker build
    ###################################################

      - name: Build Docker Compose

        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        run: |
          docker compose build



    ###################################################
    # Trivy filesystem
    ###################################################

      - name: Trivy filesystem scan

        uses: aquasecurity/trivy-action@master

        continue-on-error: true

        with:

          scan-type: fs

          scan-ref: .

          scanners: vuln

          format: table

          output: security-reports/trivy-filesystem.txt

          severity: CRITICAL,HIGH




    ###################################################
    # Build images
    ###################################################

      - name: Build backend image

        run: |
          docker build -t jobflow-backend ./Back



      - name: Build frontend image

        run: |
          docker build -t jobflow-frontend ./Front/JobFlow



      - name: Build agent image

        run: |
          docker build -t jobflow-agent ./Agent/jobflow-ai-agent




    ###################################################
    # Trivy images
    ###################################################


      - name: Scan backend image

        uses: aquasecurity/trivy-action@master

        continue-on-error: true

        with:

          image-ref: jobflow-backend

          format: table

          output: security-reports/trivy-backend.txt

          severity: CRITICAL,HIGH




      - name: Scan frontend image

        uses: aquasecurity/trivy-action@master

        continue-on-error: true

        with:

          image-ref: jobflow-frontend

          format: table

          output: security-reports/trivy-frontend.txt

          severity: CRITICAL,HIGH




      - name: Scan agent image

        uses: aquasecurity/trivy-action@master

        continue-on-error: true

        with:

          image-ref: jobflow-agent

          format: table

          output: security-reports/trivy-agent.txt

          severity: CRITICAL,HIGH




    ###################################################
    # Semgrep
    ###################################################

      - name: Semgrep SAST

        uses: semgrep/semgrep-action@v1

        continue-on-error: true

        with:

          config: auto

          generateSarif: true



      ###################################################
      # Save Semgrep result
      ###################################################

      - name: Move Semgrep report

        if: always()

        run: |

          mv semgrep.sarif security-reports/semgrep.sarif || true




    ###################################################
    # Upload reports
    ###################################################

      - name: Upload Security Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: jobflow-security-reports

          path: security-reports/

          retention-days: 30





#########################################################
# DAST
#########################################################

  dast:

    name: OWASP ZAP DAST

    needs:
      - security-scan

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Create DAST reports directory

        run: |

          mkdir -p dast-reports




      ###################################################
      # Start Application
      ###################################################

      - name: Start application

        env:

          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}


        run: |

          docker compose up -d





      ###################################################
      # Wait Backend
      ###################################################

      - name: Wait backend

        run: |

          timeout 120 bash -c '

          until curl -f http://localhost:8080/api/auth/health

          do

            echo "Waiting backend..."

            sleep 5

          done

          '





      ###################################################
      # OWASP ZAP
      ###################################################

      - name: OWASP ZAP Scan


        uses: zaproxy/action-baseline@v0.14.0


        continue-on-error: true


        with:

          target: http://localhost

          cmd_options: "-r dast-reports/zap-report.html -w dast-reports/zap-report.md -J dast-reports/zap-report.json"





      ###################################################
      # Upload DAST report
      ###################################################

      - name: Upload DAST Report

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: jobflow-dast-report

          path: dast-reports/

          retention-days: 30





      ###################################################
      # Logs
      ###################################################

      - name: Docker logs

        if: always()

        run: |

          docker compose logs > dast-reports/docker-compose.log





      ###################################################
      # Shutdown
      ###################################################

      - name: Shutdown

        if: always()

        run: |

          docker compose down -v